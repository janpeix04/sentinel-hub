[project]
name = "sentinel-hub"
version = "0.1.0"
description = "Python client library for the Sentinel Hub services."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jan", email = "j.peix04@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aenum>=3.1.17",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pyproj>=3.8.0",
    "python-dateutil>=4.0.0",
    "requests>=2.34.2",
    "requests-oauthlib>=2.0.0",
    "shapely>=2.2.0",
    "tifffile>=2026.11.16",
    "tomli-w>=1.2.0",
    "tqdm>=4.70.1",
    "utm>=0.9.0",
]

[project.scripts]
sentinel-hub = "sentinel_hub.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-dependency>=0.6.1",
    "requests-mock>=1.12.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sh_integration: tests that call the live Copernicus Data Space Sentinel Hub service (need SH_CLIENT_ID and SH_CLIENT_SECRET)",
]
