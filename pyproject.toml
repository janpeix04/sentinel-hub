[project]
name = "sentinel-hub"
version = "0.1.0"
description = "Python client library for the Sentinel Hub services."
readme = "README.md"
authors = [
    { name = "Jan", email = "j.peix04@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "tifffile>=2026.11.16",
    "tomli-w>=1.2.0",
]

[project.scripts]
sentinel-hub = "sentinel_hub:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-dependency>=0.6.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
