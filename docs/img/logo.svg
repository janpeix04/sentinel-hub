<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">Sentinel Hub</title>
  <desc id="desc">A satellite orbiting above the words Sentinel Hub</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071428"/>
      <stop offset="1" stop-color="#103463"/>
    </linearGradient>
    <radialGradient id="earth" cx="0.5" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#3fa7ff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#1b5fae" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0b2a55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7fe0"/>
      <stop offset="1" stop-color="#174b94"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4c869"/>
      <stop offset="1" stop-color="#c9902c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="360" rx="24" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="70" cy="48" r="1.6" opacity="0.8"/>
    <circle cx="150" cy="120" r="1.1" opacity="0.6"/>
    <circle cx="230" cy="36" r="1.3" opacity="0.7"/>
    <circle cx="610" cy="54" r="1.5" opacity="0.8"/>
    <circle cx="700" cy="128" r="1.1" opacity="0.6"/>
    <circle cx="742" cy="40" r="1.3" opacity="0.7"/>
    <circle cx="540" cy="24" r="1" opacity="0.5"/>
    <circle cx="300" cy="150" r="0.9" opacity="0.5"/>
    <circle cx="96" cy="200" r="1" opacity="0.5"/>
    <circle cx="720" cy="210" r="1" opacity="0.5"/>
  </g>

  <!-- Earth glow and orbit -->
  <ellipse cx="400" cy="520" rx="520" ry="300" fill="url(#earth)"/>
  <ellipse cx="400" cy="118" rx="190" ry="44" fill="none" stroke="#5aa9ff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 7"/>

  <!-- satellite -->
  <g transform="translate(400 112) rotate(-22)">
    <!-- solar panel arms -->
    <rect x="-86" y="-2" width="172" height="4" fill="#9fb3cc"/>
    <!-- left panel -->
    <g>
      <rect x="-150" y="-22" width="70" height="44" rx="3" fill="url(#panel)" stroke="#a9d1ff" stroke-width="1.5"/>
      <path d="M-132.5 -22 V22 M-115 -22 V22 M-97.5 -22 V22 M-150 0 H-80" stroke="#a9d1ff" stroke-opacity="0.7" stroke-width="1"/>
    </g>
    <!-- right panel -->
    <g>
      <rect x="80" y="-22" width="70" height="44" rx="3" fill="url(#panel)" stroke="#a9d1ff" stroke-width="1.5"/>
      <path d="M97.5 -22 V22 M115 -22 V22 M132.5 -22 V22 M80 0 H150" stroke="#a9d1ff" stroke-opacity="0.7" stroke-width="1"/>
    </g>
    <!-- body -->
    <rect x="-24" y="-30" width="48" height="60" rx="6" fill="url(#body)" stroke="#fff1cc" stroke-width="1.5"/>
    <path d="M-24 -10 H24 M-24 10 H24" stroke="#8a5f17" stroke-opacity="0.5" stroke-width="1.2"/>
    <!-- sensor / dish -->
    <rect x="-8" y="30" width="16" height="10" fill="#9fb3cc"/>
    <path d="M-20 52 Q0 34 20 52 Z" fill="#e8eef7" stroke="#ffffff" stroke-width="1"/>
    <!-- antenna -->
    <line x1="0" y1="-30" x2="0" y2="-48" stroke="#e8eef7" stroke-width="2"/>
    <circle cx="0" cy="-50" r="3.5" fill="#ff6b6b"/>
  </g>

  <!-- signal waves towards Earth -->
  <g fill="none" stroke="#7cc4ff" stroke-linecap="round" stroke-width="2.2">
    <path d="M418 182 q-14 8 -28 0" opacity="0.9"/>
    <path d="M426 194 q-22 13 -44 0" opacity="0.6"/>
    <path d="M434 206 q-30 18 -60 0" opacity="0.35"/>
  </g>

  <!-- wordmark -->
  <text x="400" y="278" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="1" fill="#ffffff">Sentinel Hub</text>
  <text x="400" y="316" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" letter-spacing="0.5" fill="#a9c4e8">Python client for the Sentinel Hub APIs on the Copernicus Data Space Ecosystem</text>
</svg>
